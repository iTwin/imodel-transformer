name: Quick performance A/B

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quick-performance-ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare candidate with baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.9.0

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install candidate dependencies
        run: pnpm --dir candidate install --frozen-lockfile

      - name: Install baseline dependencies
        run: pnpm --dir baseline install --frozen-lockfile

      - name: Build candidate transformer and comparison harness
        run: |
          pnpm --dir candidate/packages/transformer build:cjs
          pnpm --dir candidate/packages/performance-tests build
          pnpm --dir candidate/packages/performance-tests test:quick-comparison
          pnpm --dir candidate/packages/performance-tests build:quick-cli

      - name: Build baseline transformer
        run: pnpm --dir baseline/packages/transformer build:cjs

      - name: Install identical harness in baseline checkout
        shell: bash
        run: |
          rm -rf baseline/packages/performance-tests/test/quick/runtime/.compiled
          mkdir -p baseline/packages/performance-tests/test/quick/runtime
          cp -R \
            candidate/packages/performance-tests/test/quick/runtime/.compiled \
            baseline/packages/performance-tests/test/quick/runtime/.compiled

      - name: Run isolated A/B comparison
        run: >-
          node
          candidate/packages/performance-tests/test/quick/runtime/.compiled/quick/src/cli/comparisonCli.js
        env:
          QUICK_PERF_BASELINE_REVISION: ${{ github.event.pull_request.base.sha }}
          QUICK_PERF_BASELINE_ROOT: ${{ github.workspace }}/baseline
          QUICK_PERF_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          QUICK_PERF_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          QUICK_PERF_COMPARISON_OUTPUT: ${{ runner.temp }}/quick-performance-comparison
          QUICK_PERF_COMPARISON_SAMPLES: 3
          QUICK_PERF_COMPARISON_THRESHOLD_PERCENT: 5
          QUICK_PERF_COMPARISON_WORKER_TIMEOUT_SECONDS: 600
          QUICK_PERF_SCENARIO: incremental-synchronization

      - name: Annotate concerning performance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const report = path.join(
            process.env.RUNNER_TEMP,
            "quick-performance-comparison",
            "comparison.json"
          );
          const summary = JSON.parse(fs.readFileSync(report, "utf8"));
          if (summary.informationalStatus !== "candidate-slower-than-threshold")
            process.exit(0);

          const delta = `${summary.percentageDelta >= 0 ? "+" : ""}${summary.percentageDelta.toFixed(2)}%`;
          const message = `Candidate median is ${delta} relative to baseline, beyond the ${summary.policy.informationalThresholdPercent}% informational threshold. This warning is not a statistical-confidence or merge-blocking result.`;
          console.log(`::warning title=Quick performance informational threshold::${message}`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `> [!WARNING]\n> ${message}\n\n`
          );
          NODE

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          report="${RUNNER_TEMP}/quick-performance-comparison/comparison.md"
          if [[ -f "${report}" ]]; then
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish comparison artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: QuickPerformanceComparison
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/quick-performance-comparison/comparison.json
            ${{ runner.temp }}/quick-performance-comparison/comparison.md
            ${{ runner.temp }}/quick-performance-comparison/comparison-samples.jsonl
            ${{ runner.temp }}/quick-performance-comparison/fixture-artifact/manifest.json
            ${{ runner.temp }}/quick-performance-comparison/executions/*/samples.jsonl
