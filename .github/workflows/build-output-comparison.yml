name: Build output comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-output-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare clean build outputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Checkout baseline
        if: always()
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Initialize comparison artifact directory
        if: always()
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/build-output-comparison"

      - name: Install pnpm
        if: always()
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.9.0

      - name: Use Node.js 24
        if: always()
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install candidate and baseline dependencies
        if: always()
        shell: bash
        run: |
          set +e
          artifact_dir="${RUNNER_TEMP}/build-output-comparison"
          pnpm --dir "${GITHUB_WORKSPACE}/candidate" install --frozen-lockfile > "${artifact_dir}/candidate-install.log" 2>&1
          candidate_status=$?
          pnpm --dir "${GITHUB_WORKSPACE}/baseline" install --frozen-lockfile > "${artifact_dir}/baseline-install.log" 2>&1
          baseline_status=$?
          if (( candidate_status != 0 || baseline_status != 0 )); then
            exit 1
          fi

      - name: Build candidate and baseline from clean outputs
        if: always()
        shell: bash
        env:
          CI: "true"
        run: |
          set +e
          artifact_dir="${RUNNER_TEMP}/build-output-comparison"
          mkdir -p "${artifact_dir}"
          export BUILD_OUTPUT_COMPARISON_DIR="${artifact_dir}"

          clean_checkout() {
            local checkout="$1"
            rm -rf \
              "${checkout}/packages/transformer/lib" \
              "${checkout}/packages/test-utils/lib" \
              "${checkout}/packages/performance-scripts/lib" \
              "${checkout}/packages/test-app/lib" \
              "${checkout}/common/api/temp"
            find "${checkout}" -type f -name '*.tsbuildinfo' -delete
          }

          run_build() {
            local name="$1"
            local checkout="$2"
            clean_checkout "${checkout}"
            local start_ms
            local end_ms
            local status
            local duration_seconds
            local success=false
            start_ms="$(node -p 'Date.now()')"
            pnpm --dir "${checkout}" build > "${artifact_dir}/${name}-build.log" 2>&1
            status=$?
            end_ms="$(node -p 'Date.now()')"
            duration_seconds="$(node -e 'process.stdout.write(((Number(process.argv[1]) - Number(process.argv[2])) / 1000).toFixed(3))' "${end_ms}" "${start_ms}")"
            if (( status == 0 )); then
              success=true
            fi
            printf '{\n  "checkout": "%s",\n  "status": %d,\n  "success": %s,\n  "durationSeconds": %s\n}\n' \
              "${name}" "${status}" "${success}" "${duration_seconds}" \
              > "${artifact_dir}/${name}-timing.json"
            if [[ "${name}" == "candidate" ]]; then
              candidate_status=${status}
            else
              baseline_status=${status}
            fi
          }

          candidate_status=1
          baseline_status=1
          run_build candidate "${GITHUB_WORKSPACE}/candidate"
          run_build baseline "${GITHUB_WORKSPACE}/baseline"

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = process.env.BUILD_OUTPUT_COMPARISON_DIR;
          const builds = ["candidate", "baseline"].map((name) =>
            JSON.parse(fs.readFileSync(path.join(directory, `${name}-timing.json`), "utf8"))
          );
          fs.writeFileSync(
            path.join(directory, "timing.json"),
            `${JSON.stringify({ builds }, null, 2)}\n`
          );
          NODE

          if (( candidate_status != 0 || baseline_status != 0 )); then
            exit 1
          fi

      - name: Compare emitted output inventories
        if: always()
        shell: bash
        run: |
          set +e
          artifact_dir="${RUNNER_TEMP}/build-output-comparison"
          pnpm --dir "${GITHUB_WORKSPACE}/candidate" run compare:build-output -- \
            --baseline "${GITHUB_WORKSPACE}/baseline" \
            --candidate "${GITHUB_WORKSPACE}/candidate" \
            --report "${artifact_dir}/comparison.json" \
            > "${artifact_dir}/comparator.log" 2>&1
          status=$?
          cat "${artifact_dir}/comparator.log"
          printf '%s\n' "${status}" > "${artifact_dir}/comparator-status.txt"
          exit "${status}"

      - name: Publish build timing summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = path.join(process.env.RUNNER_TEMP, "build-output-comparison");
          const timingPath = path.join(directory, "timing.json");
          let builds = [];
          if (fs.existsSync(timingPath)) {
            try {
              builds = JSON.parse(fs.readFileSync(timingPath, "utf8")).builds ?? [];
            } catch (error) {
              console.log(`Unable to read build timing: ${error.message}`);
            }
          }

          console.log("### Clean build timing\n");
          console.log("| Checkout | Result | Seconds |");
          console.log("| --- | --- | ---: |");
          for (const name of ["candidate", "baseline"]) {
            const build = builds.find((entry) => entry.checkout === name);
            if (build === undefined) {
              console.log(`| ${name} | not recorded | n/a |`);
            } else {
              const result = build.success ? "passed" : `failed (${build.status})`;
              console.log(`| ${name} | ${result} | ${build.durationSeconds.toFixed(3)} |`);
            }
          }

          const comparisonPath = path.join(directory, "comparison.json");
          if (fs.existsSync(comparisonPath)) {
            try {
              const comparison = JSON.parse(fs.readFileSync(comparisonPath, "utf8"));
              console.log(`\nBuild output gate: **${comparison.gate?.passed ? "passed" : "failed"}**`);
            } catch (error) {
              console.log(`\nUnable to read build output comparison: ${error.message}`);
            }
          }
          NODE

      - name: Upload comparison and timing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: BuildOutputComparison
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/build-output-comparison/**
